<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Conduit Bender</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Bender">
<style>
  body { font: 18px system-ui, sans-serif; max-width: 480px; margin: 0 auto; padding: 16px; }
  label { display: block; margin: 12px 0 4px; }
  input, select { font-size: 20px; width: 100%; padding: 6px; box-sizing: border-box; }
  output { display: block; margin-top: 16px; font-size: 22px; line-height: 1.5; }
  [hidden] { display: none !important; }
  details { margin-top: 16px; } summary { color: #1a5fb4; cursor: pointer; }
  dt { font-weight: bold; margin-top: 10px; } dd { margin: 2px 0 0; font-size: 16px; }
  .row { display: flex; gap: 12px; } .row label { flex: 1; }
</style>
</head>
<body>
<h1>Conduit Bender</h1>
<div class="row">
  <label>Bend <select id="bend">
    <option value="offset">Offset</option>
    <option value="stub">90° stub-up</option>
    <option value="b2b">Back-to-back 90</option>
    <option value="s3">3-point saddle</option>
    <option value="s4">4-point saddle</option>
  </select></label>
  <label>Units <select id="unit"><option>in</option><option>mm</option></select></label>
</div>
<!-- data-for lists the bends that use each field -->
<label data-for="offset s3 s4">Height <input id="h" type="number" inputmode="decimal" value="6"></label>
<label data-for="stub">Stub height <input id="stubH" type="number" inputmode="decimal" value="12"></label>
<label data-for="stub">Conduit size (EMT) <select id="size"><option>1/2"</option><option selected>3/4"</option><option>1"</option></select></label>
<label data-for="b2b">Outside-to-outside length <input id="len" type="number" inputmode="decimal" value="48"></label>
<label data-for="s3">Conduit end to obstacle center <input id="d3" type="number" inputmode="decimal" value="30"></label>
<label data-for="s4">Conduit end to obstacle start <input id="d4" type="number" inputmode="decimal" value="40"></label>
<label data-for="s4">Obstacle length <input id="w" type="number" inputmode="decimal" value="10"></label>
<label data-for="s3">Obstacle length (0 for a pipe) <input id="len3" type="number" inputmode="decimal" value="0" min="0"></label>
<label data-for="offset s4">Angle <select id="a"><option>10</option><option>22.5</option><option selected>30</option><option>45</option><option>60</option></select></label>
<details><summary>What do these mean?</summary><dl id="help"></dl></details>
<output id="out"></output>
<svg id="pic" viewBox="0 0 400 250" width="100%" role="img" aria-label="Drawing of the marks and the finished bend"></svg>
<div id="steps"></div>
<script src="bend.js"></script>
<script>
  const $ = id => document.getElementById(id);
  const num = id => parseFloat($(id).value);
  const tan = deg => Math.tan(deg * Math.PI / 180);
  // Top: straight conduit with marks. Bottom: bent shape, drawn to scale (true angles).
  // marks: [[position, label]], shape: [[x, height]], box: obstacle [x0, x1, height] or null.
  // dim: optional height arrow [x, height, label], drawn from the floor up.
  function draw(len, marks, shape, box, dim) {
    const maxX = Math.max(len, ...shape.map(p => p[0])), maxY = Math.max(...shape.map(p => p[1]));
    const s = Math.min(370 / maxX, 120 / maxY), X = x => 15 + x * s, Y = y => 228 - y * s;
    const pipe = 'stroke="#888" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none"';
    $("pic").innerHTML =
      `<text x="15" y="16" font-size="15" fill="#555">Mark the straight conduit</text>
       <line x1="15" y1="52" x2="${X(len)}" y2="52" ${pipe}/>
       ${marks.map(([m, t]) => `<line x1="${X(m)}" y1="40" x2="${X(m)}" y2="64" stroke="#c76b00" stroke-width="2"/>
         <text x="${X(m)}" y="34" font-size="15" text-anchor="middle" font-weight="bold">${t}</text>`).join("")}
       <text x="15" y="96" font-size="15" fill="#555">After bending</text>
       <line x1="5" y1="${Y(0) + 4}" x2="395" y2="${Y(0) + 4}" stroke="#bbb" stroke-dasharray="4 4"/>
       ${box ? `<rect x="${X(box[0])}" y="${Y(box[2]) + 2}" width="${(box[1] - box[0]) * s}" height="${box[2] * s + 2}" fill="#f2b8a2" stroke="#b5532c"/>` : ""}
       <polyline points="${shape.map(([x, y]) => `${X(x)},${Y(y)}`).join(" ")}" ${pipe}/>
       ${dim ? `<path d="M${X(dim[0]) - 5} ${Y(0)}h10M${X(dim[0])} ${Y(0)}V${Y(dim[1])}M${X(dim[0]) - 5} ${Y(dim[1])}h10" stroke="#1a5fb4" stroke-width="1.5"/>
         <text x="${X(dim[0]) + 8}" y="${(Y(0) + Y(dim[1])) / 2 + 5}" font-size="15" fill="#1a5fb4">${dim[2]}</text>` : ""}`;
  }
  const SHRINK = ["Shrink", "How much shorter the conduit ends up after bending, because it goes up and over instead of straight."];
  const HELP = {
    offset: [
      ["Height", "How far the conduit has to move over, e.g. to go from the wall onto a box. Measure from the bottom of the conduit before to the bottom after."],
      ["Angle", "The angle of both bends. 30° is the most common. Smaller angles make a longer, gentler offset; bigger angles make it shorter and harder to pull wire."],
      ["Marks apart", "Distance between the two marks on the conduit."], SHRINK],
    stub: [
      ["Stub height", "How tall the conduit stands after the 90: from the floor (the back of the bend) up to the end of the conduit."],
      ["Conduit size", "Picks the take-up. Use the size of the EMT you are bending."],
      ["Take-up", "How much length the bend uses up. You mark at stub height minus take-up. Check the number stamped on your bender."]],
    b2b: [
      ["Outside-to-outside length", "From the outside (back) of the first 90 to the outside of the second 90, e.g. the width of the box or wall you need to wrap."]],
    s3: [
      ["Height", "How tall the obstacle is: from the surface the conduit lies on to the top of the obstacle."],
      ["Conduit end to obstacle center", "Measure along the run from the end of the conduit to the middle of the obstacle."],
      ["Obstacle length", "How long the obstacle is along the run. Use 0 for a round pipe."],
      ["Center to each side", "Distance from the center mark to each side mark, if you prefer to measure from the center."], SHRINK],
    s4: [
      ["Height", "How tall the obstacle is: from the surface the conduit lies on to the top."],
      ["Conduit end to obstacle start", "Measure along the run from the end of the conduit to the near edge of the obstacle."],
      ["Obstacle length", "How long the obstacle is along the run (near edge to far edge)."],
      ["Angle", "Angle of all four bends. 30° is the most common."], SHRINK],
  };
  // Bender marks differ by brand: arrow = start of bend, star = back of 90, notch/teardrop = saddle center.
  function steps(list) {
    $("steps").innerHTML = `<h2>How to bend</h2><ol>${list.map(s => `<li>${s}</li>`).join("")}</ol>
      <p><small>Check the marks on your bender: some brands use different symbols.</small></p>`;
  }
  function render() {
    const bend = $("bend").value, u = $("unit").value, f = x => `<b>${tape(x, u)}</b>`;
    document.querySelectorAll("[data-for]").forEach(el => el.hidden = !el.dataset.for.split(" ").includes(bend));
    // Every visible number must be > 0 (or >= 0 for fields marked min="0").
    const bad = [...document.querySelectorAll("[data-for]:not([hidden]) input")]
      .some(i => !(parseFloat(i.value) > 0 || (i.min === "0" && parseFloat(i.value) === 0)));
    $("pic").innerHTML = $("steps").innerHTML = "";
    $("help").innerHTML = HELP[bend].map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join("");
    if (bad) { $("out").textContent = "Enter numbers above 0."; return; }
    const t = x => tape(x, u);
    let r;
    if (bend === "offset") {
      const h = num("h"), run = h / tan(num("a"));
      r = offset(h, num("a"));
      $("out").innerHTML = `Marks apart: ${f(r.distance)}<br>Shrink: ${f(r.shrink)}`;
      // No fixed start for an offset, so the drawing puts the first mark one spacing in.
      const d = r.distance;
      draw(3 * d, [[d, "Mark 1"], [2 * d, "Mark 2"]], [[0, 0], [d, 0], [d + run, h], [2 * d + run, h]], null, [d / 2, h, `Height ${t(h)}`]);
      const a = $("a").value;
      steps([
        `Make Mark 1 where the offset should start. Make Mark 2 ${t(d)} past it.`,
        `Put the conduit in the bender, hook toward the end, <b>arrow on Mark 1</b>. Bend to ${a}°.`,
        `Slide the conduit forward and <b>roll it over 180°</b> (the first bend points down).`,
        `<b>Arrow on Mark 2</b>, bend to ${a}°. Sight down the pipe: both bends must be in one line.`,
        `Check: the ends are parallel and ${t(h)} apart. The run is ${t(r.shrink)} shorter.`,
      ]);
    } else if (bend === "stub") {
      const h = num("stubH");
      r = stub90(h, $("size").value, u);
      $("out").innerHTML = r.mark > 0
        ? `Mark from end: ${f(r.mark)}<br>Arrow on the mark.<br><small>Take-up ${TAKE_UP[u][$("size").value]} ${u}</small>`
        : "Stub is shorter than the take-up for this size.";
      if (r.mark > 0) {
        draw(2.5 * h, [[0, "End"], [r.mark, t(r.mark)]], [[0, h], [0, 0], [1.5 * h, 0]], null, [0.25 * h, h, `Stub ${t(h)}`]);
        steps([
          `Measure ${t(r.mark)} from the end of the conduit and mark it.`,
          `Lay the conduit on the floor in the bender, hook facing the end, <b>arrow on the mark</b>.`,
          `Keep heavy foot pressure on the heel and pull the handle until the stub is at 90° (check with a level).`,
          `Check: floor to end of conduit is ${t(h)}.`,
        ]);
      }
    } else if (bend === "b2b") {
      const L = num("len"), lead = L / 4;
      r = backToBack(L);
      $("out").innerHTML = `Mark from back of first 90: ${f(r.mark)}<br>Star on the mark, bender facing the other way.`;
      draw(L + 2 * lead, [[lead, "1st 90"], [lead + L, t(L)]], [[0, lead], [0, 0], [L, 0], [L, lead]], null);
      steps([
        `Bend the first 90 (use 90° stub-up).`,
        `From the <b>back</b> (outside) of the first 90, measure ${t(L)} along the pipe and mark it.`,
        `<b>Turn the bender around</b> so it faces the first stub. Put the <b>star</b> on the mark.`,
        `Bend to 90°. Both stubs point the same way, in the same plane.`,
        `Check: outside to outside is ${t(L)}.`,
      ]);
    } else if (bend === "s3") {
      r = saddle3(num("h"), num("d3"), num("len3"));
      // Center on a whole number for easy marking; side marks stay the same distance from it.
      const c = Math.round(r.center);
      r = { ...r, first: r.first + c - r.center, last: r.last + c - r.center, center: c };
      $("out").innerHTML = r.first > 0
        ? `Side mark: ${f(r.first)} (22.5°)<br>Center: ${f(r.center)} (45°)<br>Side mark: ${f(r.last)} (22.5°)`
          + `<br>Center to each side: ${f(r.last - r.center)}<br>Shrink: ${f(r.shrink)}`
          + (num("len3") > 0 ? `<br><small>Center raised to ${tape(r.height, u)} to clear the ends</small>` : "")
        : "Obstacle is too close to the conduit end for this height.";
      if (r.first > 0) {
        const run = r.height / tan(22.5), peak = r.first + run, d = num("d3"), half = Math.max(num("len3"), num("h") / 6) / 2;
        draw(r.last * 1.15, [[r.first, t(r.first)], [r.center, t(r.center)], [r.last, t(r.last)]],
          [[0, 0], [r.first, 0], [peak, r.height], [peak + run, 0], [r.last * 1.15 - r.shrink, 0]],
          [d - half, d + half, num("h")]);
        steps([
          `Mark the center at ${t(r.center)}, then measure <b>${t(r.last - r.center)} each way</b> from it for the side marks (${t(r.first)} and ${t(r.last)}).`,
          `Put the <b>center mark on the notch</b> (teardrop / saddle mark) of the bender. Bend to <b>45°</b>.`,
          `<b>Roll the conduit 180°</b> so the hump points down.`,
          `<b>Arrow on the ${t(r.last)} side mark</b>, bend to 22.5°.`,
          `Turn the conduit end for end, <b>arrow on the ${t(r.first)} side mark</b>, bend to 22.5°.`,
          `Sight down the pipe: all three bends in one line. The conduit is ${t(r.shrink)} shorter.`,
        ]);
      }
    } else {
      const h = num("h"), w = num("w"), d = num("d4"), run = h / tan(num("a"));
      r = saddle4(h, w, d, num("a"));
      $("out").innerHTML = r.marks[0] > 0
        ? r.marks.map((m, i) => `Mark ${i + 1}: ${f(m)}`).join("<br>") + `<br>All at ${$("a").value}°. Shrink: ${f(r.shrink)}`
        : "Obstacle is too close to the conduit end for this height.";
      const m = r.marks, end = m[3] * 1.15;
      if (m[0] > 0) draw(end, m.map((x, i) => [x, String(i + 1)]),
        [[0, 0], [m[0], 0], [m[0] + run, h], [m[0] + run + w, h], [m[0] + 2 * run + w, 0], [end - r.shrink, 0]],
        [d, d + w, h]);
      if (m[0] > 0) {
        const a = $("a").value;
        steps([
          `Make the four marks: ${m.map(t).join(", ")}.`,
          `<b>Arrow on Mark 1</b>, bend to ${a}°.`,
          `<b>Roll the conduit 180°</b>, <b>arrow on Mark 2</b>, bend to ${a}°. The first offset is done.`,
          `Turn the conduit end for end, <b>arrow on Mark 4</b>, bend to ${a}°.`,
          `<b>Roll it 180°</b>, <b>arrow on Mark 3</b>, bend to ${a}°.`,
          `Sight down the pipe: all bends in one line. The conduit is ${t(r.shrink)} shorter.`,
        ]);
      }
    }
  }
  document.querySelectorAll("input, select").forEach(el => el.addEventListener("input", render));
  render();
  // Offline support; only runs over https (or localhost), so not when opened as a file.
  if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js");
</script>
</body>
</html>
